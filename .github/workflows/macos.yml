# Rung 2 on GitHub (KEY-8): on every push to the working branch and to `main`
# (ADR-0021), on GitHub's `xcode-27` runner. It runs the core's checks
# natively (make check-native, so the core's tests run on macOS as well as on
# Linux), generates the Xcode project from project.yml with XcodeGen
# (ADR-0006), builds the app and the keyboard extension for the simulator,
# checks that project.yml builds the extension and KeyboardKit exactly as the
# extension guard expects (their whole target entries, with no build tool
# plugin or script phase, known project-wide settings, the core from this repo,
# no multi-platform target, and no generation command or scheme action) and
# that the built extension loads no SwiftUI and no networking
# framework (what these checks cannot see is in scripts/extension-guard.sh),
# runs the unit tests, takes screenshots of our keyboard in the simulator,
# types through the keyboard extension there with UI tests (KEY-62), takes
# reference captures of Apple's own keyboard in ten states before Speakboard is
# enabled (KEY-9), and prepares the screenshots and captures that the
# screenshots jobs print into their job logs as text (KEY-68).
name: macos

on:
  push:
    # No pull_request trigger, as in linux.yml: the push run already shows on the pull request.
    branches: [feature/sharp-einstein-aydugs, main]
  # A run started by hand (KEY-9): with captures true (the default), it takes the reference captures of Apple's
  # keyboard whatever changed. A push takes them only when it changes a file they depend on: see
  # scripts/captures-needed.sh.
  workflow_dispatch:
    inputs:
      captures:
        description: Take the reference captures of Apple's keyboard (KEY-9)
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail, so a failing command before a `| tee` fails the step.
    shell: bash

env:
  # Xcode 27.2 has Swift 6.4.2, the version the Makefile pins (SWIFT_TAG). The
  # runner's default Xcode is 27.1, so the job selects 27.2 by path.
  XCODE_APP: /Applications/Xcode_27.2.app
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  SIM_DEVICE: iPhone 18 Pro
  SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
  DERIVED_DATA: .build/xcode
  OUT: .build/ci-out

jobs:
  apple:
    runs-on: xcode-27
    # The simulator step has its own 40-minute limit (below). The job's other steps took at most about 16 minutes on
    # the runs of KEY-9 (make check-native 5, the build 1, the unit tests up to 8, the rest 2), so 75 leaves room.
    timeout-minutes: 75
    outputs:
      # The prepared screenshots' artifact id, set only when they were uploaded: the screenshots jobs run on it.
      screenshots-artifact: ${{ steps.upload-log-images.outputs.artifact-id }}
      # The screenshots jobs' groups, a JSON array from the prepare step's groups.txt (KEY-9): one job per group.
      print-groups: ${{ steps.log-images.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The whole history, so scripts/captures-needed.sh can see what a push changed.
          fetch-depth: 0

      # KEY-9: whether this run takes the reference captures of Apple's keyboard, and why, in one line.
      - name: Does this run take the reference captures of Apple's keyboard?
        id: captures
        env:
          EVENT: ${{ github.event_name }}
          CAPTURES_INPUT: ${{ inputs.captures }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          scripts/captures-needed.sh "$EVENT" "$CAPTURES_INPUT" "$BEFORE" "$HEAD_SHA" > "$RUNNER_TEMP/captures.txt"
          cat "$RUNNER_TEMP/captures.txt" >> "$GITHUB_OUTPUT"
          echo "speakboard-captures: $(tr '\n' ' ' < "$RUNNER_TEMP/captures.txt")"

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP/Contents/Developer"

      - name: What the runner has
        run: |
          mkdir -p "$OUT"
          {
            echo "== macOS"; sw_vers; uname -m
            echo "== Xcode installs"
            for app in /Applications/Xcode*.app; do
              [ -L "$app" ] && continue
              echo "$app: $("$app/Contents/Developer/usr/bin/xcodebuild" -version | tr '\n' ' ')"
              echo "    $(DEVELOPER_DIR="$app/Contents/Developer" xcrun swift --version 2>&1 | head -1)"
            done
            echo "== Selected"; xcode-select -p; xcodebuild -version; swift --version
            echo "== SDKs"; xcodebuild -showsdks
            echo "== Simulator runtimes"; xcrun simctl list runtimes
            echo "== Simulator devices (available)"; xcrun simctl list devices available
            echo "== bash, make"; /bin/bash --version | head -1; make --version | head -1
          } 2>&1 | tee "$OUT/runner.txt"

      - name: make check-native
        run: make check-native 2>&1 | tee "$OUT/make-check-native.log"

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          bin=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)
          [ -n "$bin" ] || { echo "no xcodegen binary in the release zip" >&2; exit 1; }
          dirname "$bin" >> "$GITHUB_PATH"
          "$bin" --version

      - name: Generate the Xcode project
        run: |
          xcodegen generate 2>&1 | tee "$OUT/xcodegen.log"
          # The project is generated, never committed (ADR-0006).
          git status --porcelain --untracked-files=all | tee "$OUT/git-status.txt"
          [ ! -s "$OUT/git-status.txt" ] || { echo "generation left files git would see" >&2; exit 1; }

      - name: The extension guard checks the project (targets, multi-platform, generation and scheme scripts)
        run: |
          scripts/extension-guard-selftest.sh project
          scripts/extension-guard.sh project project.yml

      - name: Build the app and the keyboard extension
        run: |
          xcodebuild -project Speakboard.xcodeproj -scheme Speakboard \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE,OS=27.2" \
            -derivedDataPath "$DERIVED_DATA" build 2>&1 | tee "$OUT/xcodebuild-build.log" | grep -E '(error|warning):|BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$OUT/xcodebuild-build.log"

      - name: The built extension loads no SwiftUI and no networking framework
        run: |
          scripts/extension-guard.sh binary \
            "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Speakboard.app/PlugIns/SpeakboardKeyboard.appex"

      - name: Unit tests
        run: |
          xcodebuild -project Speakboard.xcodeproj -scheme Speakboard \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE,OS=27.2" \
            -derivedDataPath "$DERIVED_DATA" test 2>&1 | tee "$OUT/xcodebuild-test.log" \
            | grep -E '(error|warning):|Test run with|✘|TEST (SUCCEEDED|FAILED)' || true
          # KEY-9: the filter above shows a passing run; a failing one needs more, and the artifact cannot be read
          # from a session (KEY-54). So on a failure, a bounded excerpt of the full log: the lines that name a
          # failure, with three lines around each (at most 150 lines), then the log's last 60 lines.
          log="$OUT/xcodebuild-test.log"
          if ! grep -q '\*\* TEST SUCCEEDED \*\*' "$log"; then
            echo "== the unit tests failed; $log has $(wc -l < "$log" | tr -d ' ') lines"
            echo "== its lines that name a failure, with three lines around each (at most 150 lines):"
            grep -n -B 3 -A 3 -E 'error|[Ff]ail|✘|[Tt]imed out|[Cc]rash|[Cc]ancel|[Uu]nable to|[Cc]ould not|[Ee]xception' "$log" \
              | head -n 150 || true
            echo "== its last 60 lines:"
            tail -n 60 "$log"
            exit 1
          fi

      - name: The keyboard in the simulator, screenshots and the typing proof
        id: sim
        # Its own limit (KEY-9): the slowest run with captures took 32.5 minutes here (503073b). A slow run then
        # fails this step inside the job's 75 minutes, and the steps after it (prepare, upload) still run.
        timeout-minutes: 40
        env:
          SPEAKBOARD_CAPTURES: ${{ steps.captures.outputs.captures }}
          SPEAKBOARD_CAPTURES_WHY: ${{ steps.captures.outputs.why }}
        run: |
          scripts/sim-keyboard.sh "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Speakboard.app" \
            "$SIM_DEVICE" "$SIM_RUNTIME" "$OUT/screenshots" "$DERIVED_DATA"

      # KEY-68: the cropped and reduced screenshots that the screenshots jobs below print into their job logs.
      - name: Prepare the screenshots for the screenshots jobs
        id: prepare
        if: always() && steps.sim.outcome != 'skipped'
        env:
          SPEAKBOARD_CAPTURES: ${{ steps.captures.outputs.captures }}
          SPEAKBOARD_CAPTURES_WHY: ${{ steps.captures.outputs.why }}
        run: scripts/screenshots-to-log.sh prepare "$OUT/screenshots" "$OUT/log-images"

      # KEY-69: only when at least one image was made. A simulator step that fails early leaves a folder with only
      # what.tsv and none.txt, and printing that would only add red jobs with no image.
      - name: Count the prepared screenshots
        id: log-images
        if: always() && steps.prepare.outcome != 'skipped'
        run: |
          count=0
          if [ -d "$OUT/log-images" ]; then
            count=$(find "$OUT/log-images" -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' \) | wc -l | tr -d ' ')
          fi
          echo "speakboard-screenshots: $count prepared images"
          if [ "$count" -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
          if groups=$(scripts/screenshots-to-log.sh groups "$OUT/log-images"); then
            echo "speakboard-screenshots: the screenshots jobs' groups: $groups"
            echo "groups=$groups" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the prepared screenshots
        id: upload-log-images
        if: always() && steps.log-images.outputs.any == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-for-logs
          path: .build/ci-out/log-images
          if-no-files-found: error
          retention-days: 30

      - name: Upload the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-screenshots-and-logs
          # Not the UI tests' result bundles (KEY-9): with two more UI test runs, and a failure's diagnostics, they
          # made this artifact 145 MB in 4,076 files (run 44787518860). Their logs and exported attachments stay.
          path: |
            .build/ci-out
            !.build/ci-out/**/*.xcresult
            !.build/ci-out/**/*.xcresult/**
          if-no-files-found: error
          retention-days: 30

      # KEY-69: the screenshots jobs run on the upload's artifact-id. If it ever came back empty after an upload that
      # succeeded (a renamed step id, a change in the action), they would all be skipped and a green run would carry
      # no screenshots without anyone seeing it; this makes that red.
      # KEY-9: the same for the groups the screenshots jobs' matrix is made from.
      - name: The prepared screenshots' artifact has an id
        if: >-
          always() && steps.upload-log-images.outcome == 'success'
          && (steps.upload-log-images.outputs.artifact-id == '' || steps.log-images.outputs.groups == '')
        run: |
          echo "the upload of the prepared screenshots succeeded, but gave no artifact-id or there are no groups:" \
            "the screenshots jobs would be skipped" >&2
          exit 1

  # KEY-68: the screenshots as text in job logs an agent can read whole. Agents cannot download artifacts (KEY-54),
  # and GitHub's job-log tool returns at most the last 5,000 lines of a job's log, so each group of images is
  # printed by its own small job whose whole log fits in those 5,000 lines (each prints at most its budget of 4,600
  # lines; see scripts/screenshots-to-log.sh), and the apple job's own log stays short. A job fetching
  # its own workflow's artifact inside CI is not the download KEY-54 forbids. Recover the images from one of these
  # jobs' logs with scripts/screenshots-from-log.sh. When a screenshots job fails, the run fails too; the apple
  # job keeps its own result, which is what says whether the build, the tests and the typing proof passed.
  screenshots:
    name: screenshots (${{ matrix.group }})
    needs: apple
    # Only when the apple job uploaded the prepared screenshots (at least one image), whether it then passed or
    # failed, the simulator step's own 40-minute timeout included (a step that times out fails, and the prepare and
    # upload steps after it still run): an apple job that fails before then leaves no artifact, and these jobs would
    # only add failures that say nothing. Not in a cancelled run (KEY-69): its prepare and upload steps still run,
    # as always() steps do on a cancel, but nobody is waiting for the images. In this job's condition, cancelled() is
    # true only when the run was cancelled, not when the apple job failed. What happens on the job's own timeout is
    # not shown.
    if: ${{ !cancelled() && needs.apple.outputs.screenshots-artifact != '' && needs.apple.outputs.print-groups != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # From the apple job (KEY-9): of keyboard-light, keyboard-dark, ui-light, ui-dark, manifest and one group per
        # capture of Apple's keyboard (or per band of one cut into bands), those whose images were all made. The
        # fallback is never used when the job runs.
        group: ${{ fromJSON(needs.apple.outputs.print-groups || '["none"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the prepared screenshots from the apple job
        uses: actions/download-artifact@v7
        with:
          name: screenshots-for-logs
          path: log-images

      - name: Print the screenshots into the job log
        env:
          GROUP: ${{ matrix.group }}
        run: scripts/screenshots-to-log.sh print log-images "$GROUP"
