# Rung 2 on GitHub (KEY-8): on every push to the working branch and to `main`
# (ADR-0021), on GitHub's `xcode-27` runner. It runs the core's checks
# natively (make check-native, so the core's tests run on macOS as well as on
# Linux), generates the Xcode project from project.yml with XcodeGen
# (ADR-0006), builds the app and the keyboard extension for the simulator,
# checks that project.yml gives the extension only the sources the extension
# guard scans and that the built extension loads no SwiftUI and no networking
# framework (what these checks cannot see is in scripts/extension-guard.sh),
# runs the unit tests, and takes screenshots of our keyboard in the simulator.
name: macos

on:
  push:
    # No pull_request trigger, as in linux.yml: the push run already shows on the pull request.
    branches: [feature/sharp-einstein-aydugs, main]

permissions:
  contents: read

defaults:
  run:
    # bash -eo pipefail, so a failing command before a `| tee` fails the step.
    shell: bash

env:
  # Xcode 27.2 has Swift 6.4.2, the version the Makefile pins (SWIFT_TAG). The
  # runner's default Xcode is 27.1, so the job selects 27.2 by path.
  XCODE_APP: /Applications/Xcode_27.2.app
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  SIM_DEVICE: iPhone 18 Pro
  SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
  DERIVED_DATA: .build/xcode
  OUT: .build/ci-out

jobs:
  apple:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP/Contents/Developer"

      - name: What the runner has
        run: |
          mkdir -p "$OUT"
          {
            echo "== macOS"; sw_vers; uname -m
            echo "== Xcode installs"
            for app in /Applications/Xcode*.app; do
              [ -L "$app" ] && continue
              echo "$app: $("$app/Contents/Developer/usr/bin/xcodebuild" -version | tr '\n' ' ')"
              echo "    $(DEVELOPER_DIR="$app/Contents/Developer" xcrun swift --version 2>&1 | head -1)"
            done
            echo "== Selected"; xcode-select -p; xcodebuild -version; swift --version
            echo "== SDKs"; xcodebuild -showsdks
            echo "== Simulator runtimes"; xcrun simctl list runtimes
            echo "== Simulator devices (available)"; xcrun simctl list devices available
            echo "== bash, make"; /bin/bash --version | head -1; make --version | head -1
          } 2>&1 | tee "$OUT/runner.txt"

      - name: make check-native
        run: make check-native 2>&1 | tee "$OUT/make-check-native.log"

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          bin=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)
          [ -n "$bin" ] || { echo "no xcodegen binary in the release zip" >&2; exit 1; }
          dirname "$bin" >> "$GITHUB_PATH"
          "$bin" --version

      - name: Generate the Xcode project
        run: |
          xcodegen generate 2>&1 | tee "$OUT/xcodegen.log"
          # The project is generated, never committed (ADR-0006).
          git status --porcelain --untracked-files=all | tee "$OUT/git-status.txt"
          [ ! -s "$OUT/git-status.txt" ] || { echo "generation left files git would see" >&2; exit 1; }

      - name: The extension guard scans exactly the extension's sources
        run: |
          scripts/extension-guard-selftest.sh project
          scripts/extension-guard.sh project project.yml

      - name: Build the app and the keyboard extension
        run: |
          xcodebuild -project Speakboard.xcodeproj -scheme Speakboard \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE,OS=27.2" \
            -derivedDataPath "$DERIVED_DATA" build 2>&1 | tee "$OUT/xcodebuild-build.log" | grep -E '(error|warning):|BUILD' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$OUT/xcodebuild-build.log"

      - name: The built extension loads no SwiftUI and no networking framework
        run: |
          scripts/extension-guard.sh binary \
            "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Speakboard.app/PlugIns/SpeakboardKeyboard.appex"

      - name: Unit tests
        run: |
          xcodebuild -project Speakboard.xcodeproj -scheme Speakboard \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE,OS=27.2" \
            -derivedDataPath "$DERIVED_DATA" test 2>&1 | tee "$OUT/xcodebuild-test.log" \
            | grep -E '(error|warning):|Test run with|✘|TEST (SUCCEEDED|FAILED)' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' "$OUT/xcodebuild-test.log"

      - name: Screenshots of the keyboard in the simulator
        run: |
          scripts/sim-keyboard.sh "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Speakboard.app" \
            "$SIM_DEVICE" "$SIM_RUNTIME" "$OUT/screenshots"

      - name: Upload the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-screenshots-and-logs
          path: .build/ci-out
          if-no-files-found: error
          retention-days: 30
