# Rung 1 on GitHub: runs `make check` on every push to the working branch and
# to `main` (ADR-0021), on a GitHub-hosted Linux runner. The Makefile runs Swift in the pinned image
# (SWIFT_TAG), so CI and a local `make check` use the same image and steps.
#
# On a hosted runner the Docker daemon is already running and the runner user
# can reach it, so scripts/docker-ready.sh skips starting dockerd and only
# pulls the image.
name: linux

on:
  push:
    # No pull_request trigger: the push run on the head commit already shows on
    # the pull request, and a second trigger would run everything twice.
    branches: [feature/sharp-einstein-aydugs, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The repo is mounted into the Swift container; keep the token out of .git/config.
          persist-credentials: false

      - name: make check
        run: |
          set -o pipefail
          make check 2>&1 | tee make-check.log

      - name: Upload the make check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: make-check-log
          path: make-check.log
          if-no-files-found: error
          retention-days: 30
